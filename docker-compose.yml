services:
  mysql:
    image: mysql:8.0
    container_name: taskflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taskflow-phpmyadmin
    ports:
      - "8081:80"   # 8081 au lieu de 8080
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_DB: taskflow
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./taskflow-backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: "mysql://root:root@mysql:3306/taskflow"
      JWT_PASSPHRASE: "dev-secret-key"
      APP_ENV: dev
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./taskflow-backend:/app

  frontend:
    build:
      context: ./taskflow-frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "4201:4200"
    depends_on:
      - backend
    volumes:
      - ./taskflow-frontend:/app
      - /app/node_modules

volumes:
  mysql_data: