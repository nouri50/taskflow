<div class="dashboard">
    <header class="header">
        <div class="header-left">
            <span class="logo">✓</span>
            <h1>TaskFlow</h1>
        </div>
        <button class="btn-logout" (click)="logout()">Déconnexion</button>
    </header>

    <main class="content">
        <div class="content-header">
            <h2>Mes Boards</h2>
            <button class="btn-primary" (click)="showCreateForm = !showCreateForm">+ Nouveau Board</button>
        </div>

        <div class="create-form" *ngIf="showCreateForm">
            <input type="text" [(ngModel)]="newBoardName" placeholder="Nom du board" />
            <input type="text" [(ngModel)]="newBoardDescription" placeholder="Description (optionnel)" />
            <div class="form-actions">
                <button class="btn-primary" (click)="createBoard()" [disabled]="loading">Créer</button>
                <button class="btn-cancel" (click)="showCreateForm = false">Annuler</button>
            </div>
        </div>

        <div class="boards-grid">
            <div class="board-card" *ngFor="let board of boards">

                <!-- Mode édition -->
                <div *ngIf="editingBoard?.id === board.id" class="edit-form">
                    <input type="text" [(ngModel)]="editName" placeholder="Nom" />
                    <input type="text" [(ngModel)]="editDescription" placeholder="Description" />
                    <div class="form-actions">
                        <button class="btn-primary" (click)="saveBoard(board)">Sauvegarder</button>
                        <button class="btn-cancel" (click)="editingBoard = null">Annuler</button>
                    </div>
                </div>

                <!-- Mode affichage -->
                <div *ngIf="editingBoard?.id !== board.id" (click)="openBoard(board.id)" class="board-content">
                    <h3>{{ board.name }}</h3>
                    <p>{{ board.description || 'Aucune description' }}</p>
                    <div class="board-actions" (click)="$event.stopPropagation()">
                        <button class="btn-edit" (click)="startEdit(board)">✏️</button>
                        <button class="btn-delete" (click)="deleteBoard(board.id)">🗑️</button>
                    </div>
                </div>

            </div>

            <div class="board-card empty" *ngIf="boards.length === 0">
                <p>Aucun board. Créez-en un !</p>
            </div>
        </div>
    </main>

    <!-- Modal confirmation suppression -->
    <div class="modal-overlay" *ngIf="boardToDelete">
        <div class="confirm-modal">
            <h3>Supprimer ce board ?</h3>
            <p>Cette action est irréversible. Toutes les colonnes et cartes seront supprimées.</p>
            <div class="modal-actions">
                <button class="btn-danger" (click)="confirmDelete()">Supprimer</button>
                <button class="btn-cancel" (click)="boardToDelete = null">Annuler</button>
            </div>
        </div>
    </div>
</div>
