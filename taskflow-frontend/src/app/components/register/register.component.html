<div class="auth-container">
    <div class="auth-card">
        <h1>TaskFlow</h1>
        <p>Créer votre compte</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" formControlName="firstName" placeholder="Prénom" />
                </div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" formControlName="lastName" placeholder="Nom" />
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="votre@email.com" />
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" formControlName="password" placeholder="••••••••" />
            </div>

            <div class="error" *ngIf="error">{{ error }}</div>

            <button type="submit" [disabled]="loading" class="btn-primary">
                {{ loading ? 'Création...' : 'Créer mon compte' }}
            </button>
        </form>

        <p class="link">Vous avez déjà un compte? <a routerLink="/login">Se connecter</a></p>
    </div>
</div>
