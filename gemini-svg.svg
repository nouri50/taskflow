<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrière-plan global -->
  <rect width="1280" height="800" fill="#F4F6F9"/>

  <!-- HEADER (Bleu foncé TaskFlow) -->
  <rect width="1280" height="70" fill="#4A6CF7"/>
  <!-- Logo (Flat design simple) -->
  <rect x="25" y="15" width="40" height="40" rx="6" fill="white" fill-opacity="0.2"/>
  <path d="M41 27V43" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M49 22V43" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 32V43" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Nom du projet -->
  <text x="80" y="42" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">TaskFlow / Sprint Q2</text>
  <!-- Liens & Avatar à droite -->
  <text x="1080" y="41" fill="white" font-family="Arial, sans-serif" font-size="14">Tableau</text>
  <text x="1150" y="41" fill="#C4CFFC" font-family="Arial, sans-serif" font-size="14">Membres</text>
  <circle cx="1230" cy="35" r="18" fill="#E2E8F0"/>
  <text x="1230" y="39" fill="#718096" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MJ</text>

  <!-- CONTENU PRINCIPAL (Système de colonnes) -->
  
  <!-- Zone Kanban (légèrement décalée du header) -->
  <g transform="translate(25, 100)">
    
    <!-- Colonne 1: À FAIRE (To Do) -->
    <g transform="translate(0, 0)">
      <rect width="260" height="660" rx="8" fill="#EDF2F7"/>
      <text x="15" y="30" fill="#2D3748" font-family="Arial, sans-serif" font-size="15" font-weight="bold">À FAIRE</text>
      <circle cx="95" y="25" r="10" fill="#CBD5E0"/>
      <text x="95" y="29" fill="#2D3748" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">3</text>
      
      <!-- Cartes -->
      <g transform="translate(10, 55)">
        <!-- Carte 1 (Priorité Haute) -->
        <g>
          <rect width="240" height="110" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="110" rx="2" fill="#E53E3E"/> <!-- Bordure colorée gauche (Rouge) -->
          <text x="15" y="25" fill="#2D3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Maquette UI de TaskFlow</text>
          <text x="15" y="48" fill="#718096" font-family="Arial, sans-serif" font-size="12">Générer un SVG complet pour desktop</text>
          
          <rect x="15" y="75" width="55" height="20" rx="4" fill="#FED7D7"/>
          <text x="42.5" y="89" fill="#C53030" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Design</text>
          
          <circle cx="215" cy="85" r="12" fill="#E2E8F0"/>
          <text x="215" y="89" fill="#718096" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AL</text>
        </g>
        
        <!-- Carte 2 -->
        <g transform="translate(0, 125)">
          <rect width="240" height="90" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="90" rx="2" fill="#4A6CF7"/> <!-- Bordure colorée gauche (Bleu) -->
          <text x="15" y="25" fill="#2D3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Review Architecture</text>
          <text x="15" y="48" fill="#718096" font-family="Arial, sans-serif" font-size="12">Vérifier les choix techniques pour le backend</text>
        </g>
      </g>

      <!-- Bouton "+ Ajouter une carte" -->
      <g transform="translate(10, 610)">
        <rect width="240" height="40" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="120" y="25" fill="#4A6CF7" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Ajouter une carte</text>
      </g>
    </g>

    <!-- Colonne 2: EN COURS (In Progress) -->
    <g transform="translate(285, 0)">
      <rect width="260" height="660" rx="8" fill="#EDF2F7"/>
      <text x="15" y="30" fill="#2D3748" font-family="Arial, sans-serif" font-size="15" font-weight="bold">EN COURS</text>
      <circle cx="105" y="25" r="10" fill="#CBD5E0"/>
      <text x="105" y="29" fill="#2D3748" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">2</text>
      
      <!-- Cartes -->
      <g transform="translate(10, 55)">
        <!-- Carte 3 (Active et sélectionnée pour la modal) -->
        <g>
          <rect width="240" height="120" rx="6" fill="white" stroke="#4A6CF7" stroke-width="2"/> <!-- Contour bleu (sélection) -->
          <rect width="4" height="120" rx="2" fill="#DD6B20"/> <!-- Bordure colorée gauche (Orange) -->
          <text x="15" y="25" fill="#2D3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Intégration API Stripe</text>
          <text x="15" y="48" fill="#718096" font-family="Arial, sans-serif" font-size="12">Implémenter les webhooks pour les paiements</text>
          
          <rect x="15" y="85" width="60" height="20" rx="4" fill="#FEEBC8"/>
          <text x="45" y="99" fill="#C05621" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Backend</text>
          
          <circle cx="215" cy="95" r="12" fill="#4A6CF7"/>
          <text x="215" y="99" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ME</text>
        </g>
      </g>

      <!-- Bouton "+ Ajouter une carte" -->
      <g transform="translate(10, 610)">
        <rect width="240" height="40" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="120" y="25" fill="#4A6CF7" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Ajouter une carte</text>
      </g>
    </g>

    <!-- Colonne 3: TERMINÉ (Done) -->
    <g transform="translate(570, 0)">
      <rect width="260" height="660" rx="8" fill="#EDF2F7"/>
      <text x="15" y="30" fill="#2D3748" font-family="Arial, sans-serif" font-size="15" font-weight="bold">TERMINÉ</text>
      <circle cx="95" y="25" r="10" fill="#C6F6D5"/> <!-- Vert discret pour le statut -->
      <text x="95" y="29" fill="#2F855A" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">7</text>
      
      <!-- Cartes -->
      <g transform="translate(10, 55)">
        <!-- Carte 4 (Archivée) -->
        <g>
          <rect width="240" height="90" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="90" rx="2" fill="#38A169"/> <!-- Bordure colorée gauche (Vert) -->
          <text x="15" y="25" fill="#718096" font-family="Arial, sans-serif" font-size="14">Setup Base de données</text>
          <text x="15" y="48" fill="#A0AEC0" font-family="Arial, sans-serif" font-size="12">PostgreSQL instance configurée</text>
        </g>
      </g>

      <!-- Bouton "+ Ajouter une carte" -->
      <g transform="translate(10, 610)">
        <rect width="240" height="40" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="120" y="25" fill="#4A6CF7" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Ajouter une carte</text>
      </g>
    </g>

  </g> <!-- Fin Zone Kanban -->

  <!-- OVERLAY (pour fondre le fond quand la modal est ouverte) -->
  <rect width="1280" height="800" fill="black" fill-opacity="0.3"/>

  <!-- MODAL DE DÉTAIL DE CARTE (Sur la droite, simulant une ouverture) -->
  <g transform="translate(860, 0)">
    <rect width="420" height="800" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Header Modal -->
    <rect width="420" height="70" fill="#EDF2F7"/>
    <text x="30" y="42" fill="#2D3748" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Intégration API Stripe</text>
    <text x="30" y="60" fill="#718096" font-family="Arial, sans-serif" font-size="11">Dans la colonne "En cours"</text>
    <!-- Bouton Fermer (X) -->
    <path d="M380 25 L395 40 M395 25 L380 40" stroke="#718096" stroke-width="2" stroke-linecap="round"/>

    <!-- Contenu Modal -->
    <g transform="translate(30, 100)">
      <!-- Label & Badge -->
      <text x="0" y="10" fill="#A0AEC0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">ÉTIQUETTE</text>
      <rect x="0" y="20" width="60" height="20" rx="4" fill="#FEEBC8"/>
      <text x="30" y="34" fill="#C05621" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Backend</text>

      <!-- Description -->
      <g transform="translate(0, 70)">
        <text x="0" y="0" fill="#4A5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Description</text>
        <rect x="0" y="15" width="360" height="150" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="15" y="35" fill="#718096" font-family="Arial, sans-serif" font-size="13">
          <tspan x="15" dy="0">Il s'agit d'implémenter les webhooks Stripe pour gérer</tspan>
          <tspan x="15" dy="18">les événements de paiement (success, failure, subscription</tspan>
          <tspan x="15" dy="18">updates). Connecter l'endpoint à la DB.</tspan>
        </text>
      </g>

      <!-- Assignation -->
      <g transform="translate(0, 250)">
        <text x="0" y="0" fill="#4A5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Assignation</text>
        <circle cx="20" y="28" r="16" fill="#4A6CF7"/>
        <text x="20" y="32" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ME</text>
        <text x="45" y="32" fill="#2D3748" font-family="Arial, sans-serif" font-size="13">Marc Ébène (Vous)</text>
      </g>

      <!-- Date limite -->
      <g transform="translate(0, 310)">
        <text x="0" y="0" fill="#4A5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Date limite</text>
        <rect x="0" y="15" width="160" height="40" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="15" y="39" fill="#DD6B20" font-family="Arial, sans-serif" font-size="13" font-weight="bold">28 Mai 2024</text>
        <path d="M130 29 L145 29 M137.5 22 L137.5 36" stroke="#DD6B20" stroke-width="1.5" stroke-linecap="round"/> <!-- Icône Calendrier simplifiée -->
      </g>

      <!-- Boutons d'action rapides -->
      <g transform="translate(0, 600)">
        <rect width="110" height="36" rx="6" fill="#4A6CF7"/>
        <text x="55" y="22" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Modifier</text>
        
        <rect x="120" y="0" width="110" height="36" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        <text x="175" y="22" fill="#718096" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Archiver</text>
      </g>

    </g> <!-- Fin Contenu Modal -->
  </g> <!-- Fin Modal -->

</svg>
